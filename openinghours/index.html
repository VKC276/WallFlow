<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f2">
  <meta name="description" content="Öppettider för Västerviks klätterhall — publik kalender.">
  <!-- Google Sites / iframe: tillåt inbäddning -->
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors *">
  <title>Öppettider — Västerviks klätterhall</title>
  <link rel="icon" href="../favicon.ico" sizes="32x32">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="icon" href="../icon-32.png" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Matchar vastervikclimbing.se (Google Sites: Roboto + ljus bakgrund) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f2f2;
      --text: #202124;
      --muted: #5f6368;
      --line: rgba(32, 33, 36, 0.14);
      --accent: #c47a1a;
      --surface: #ffffff;
      --surface-2: #e8e8e8;
      --closed: #f5c6c6;
      --closed-text: #7a2e2e;
      --open: #d8f0e8;
      --open-text: #1b5c48;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font-display: "Roboto", Arial, sans-serif;
      --font-body: "Roboto", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: var(--font-body);
      background: var(--bg);
    }
    body {
      padding:
        calc(16px + var(--safe-top))
        14px
        calc(18px + var(--safe-bottom));
    }
    html.is-embed body { padding: 10px 10px 12px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    header { margin-bottom: 16px; }
    .brand {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.45rem, 5vw, 2rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--text);
    }
    .lede {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      max-width: 36em;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 16px 0 12px;
    }
    .nav-btn {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: 500;
      font-size: 0.85rem;
      padding: 8px 12px;
      cursor: pointer;
    }
    .nav-btn:hover { background: var(--surface-2); }
    .nav-btn:disabled { opacity: 0.45; cursor: default; }
    .month-label {
      margin: 0 auto;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      text-transform: capitalize;
      color: var(--text);
    }
    .today-pill {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
    }
    .cal {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }
    .dow {
      text-align: center;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 0 6px;
    }
    .day {
      position: relative;
      min-height: 72px;
      padding: 8px 6px 6px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .day.in-month { animation: day-in 0.35s ease both; }
    .day.open {
      background: var(--open);
      border-color: rgba(27, 92, 72, 0.22);
      color: var(--open-text);
    }
    .day.closed {
      background: var(--closed);
      border-color: rgba(180, 70, 70, 0.35);
      color: var(--closed-text);
    }
    .day.outside {
      opacity: 0.35;
      background: transparent;
      border-color: transparent;
    }
    .day.is-today {
      box-shadow: 0 0 0 2px var(--accent);
      border-color: var(--accent);
    }
    .day.has-exception::after {
      content: "";
      position: absolute;
      top: 7px;
      right: 7px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .day-num {
      font-weight: 700;
      font-size: 0.82rem;
      line-height: 1;
      color: inherit;
    }
    .day-hours {
      margin-top: auto;
      font-size: 0.68rem;
      font-weight: 500;
      line-height: 1.2;
      color: inherit;
    }
    .day.outside .day-hours { display: none; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin: 14px 0 8px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      border: 1px solid var(--line);
    }
    .swatch.open { background: var(--open); border-color: rgba(27, 92, 72, 0.22); }
    .swatch.closed { background: var(--closed); border-color: rgba(180, 70, 70, 0.35); }
    .swatch.exception {
      background: transparent;
      position: relative;
    }
    .swatch.exception::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--accent);
    }
    .status {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
    }
    .status.error { color: var(--closed-text); }
    .boot {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 24px 0;
    }
    .note-line {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(196, 122, 26, 0.35);
      background: #fff8ee;
      color: var(--text);
      font-size: 0.84rem;
      line-height: 1.35;
    }
    .note-line strong { color: var(--accent); }
    @keyframes day-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @media (max-width: 520px) {
      .day { min-height: 62px; padding: 6px 4px 4px; border-radius: 10px; }
      .day-hours { font-size: 0.6rem; }
      .day-num { font-size: 0.75rem; }
      .cal { gap: 4px; }
      .month-label { width: 100%; text-align: center; order: -1; margin: 0 0 4px; }
      .today-pill { width: 100%; margin: 0; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <p class="boot" id="boot">Hämtar öppettider…</p>
  </div>

  <script>
const API_URL = "https://wallflow.muddy-rice-38d4.workers.dev/";
const REFRESH_MS = 5 * 60 * 1000;
const DOW = ["Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön"];
const MONTHS_SV = [
  "januari", "februari", "mars", "april", "maj", "juni",
  "juli", "augusti", "september", "oktober", "november", "december"
];

let state = {
  yearMonth: "",
  today: "",
  week: null,
  daysByDate: {},
  error: "",
  loading: true
};
let refreshTimer = null;

(function bootEmbedFlag_() {
  const q = new URLSearchParams(location.search);
  if (q.get("embed") === "1" || window.self !== window.top) {
    document.documentElement.classList.add("is-embed");
  }
  const m = String(q.get("month") || "").trim();
  if (/^\d{4}-\d{2}$/.test(m)) state.yearMonth = m;
})();

function escapeHtml_(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function apiCall_(action, args) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain; charset=UTF-8" },
    body: JSON.stringify({ action, token: "", args: args || [] })
  }).then((r) => r.json());
}

function todayLocalYmd_() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function shiftMonth_(ym, delta) {
  const [y, m] = String(ym).split("-").map(Number);
  const dt = new Date(y, m - 1 + delta, 1);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0");
}

function monthTitle_(ym) {
  const [y, m] = String(ym).split("-").map(Number);
  return (MONTHS_SV[m - 1] || "") + " " + y;
}

function formatHours_(day) {
  if (!day || day.closed) return "Stängt";
  if (day.hoursLabel) return String(day.hoursLabel);
  if (Array.isArray(day.slots) && day.slots.length) {
    return day.slots.map((s) => String(s.open || "") + "–" + String(s.close || "")).join(" · ");
  }
  return String(day.open || "") + "–" + String(day.close || "");
}

function buildMonthGrid_(ym, daysByDate, today) {
  const [y, m] = String(ym).split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const lastDate = new Date(y, m, 0).getDate();
  let startPad = first.getDay() - 1; // Mon=0
  if (startPad < 0) startPad = 6;
  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push(null);
  for (let d = 1; d <= lastDate; d++) {
    const date = ym + "-" + String(d).padStart(2, "0");
    cells.push({ date, day: daysByDate[date] || null, num: d });
  }
  while (cells.length % 7 !== 0) cells.push(null);
  return cells.map((c, idx) => {
    if (!c) return `<div class="day outside" aria-hidden="true"></div>`;
    const closed = !c.day || c.day.closed;
    const isToday = c.date === today;
    const ex = !!(c.day && c.day.isException);
    const delay = Math.min(idx * 18, 280);
    return `<div class="day in-month ${closed ? "closed" : "open"}${isToday ? " is-today" : ""}${ex ? " has-exception" : ""}" style="animation-delay:${delay}ms">
      <div class="day-num">${c.num}</div>
      <div class="day-hours">${escapeHtml_(formatHours_(c.day))}</div>
    </div>`;
  }).join("");
}

function addDaysYmdPub_(ymd, days) {
  const m = String(ymd || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return "";
  const dt = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  dt.setUTCDate(dt.getUTCDate() + Number(days || 0));
  return dt.toISOString().slice(0, 10);
}

function formatNoteDate_(ymd) {
  return ymd.slice(8) + "/" + ymd.slice(5, 7);
}

function exceptionNotesHtml_(daysByDate, ym) {
  const notes = Object.keys(daysByDate)
    .filter((d) => d.startsWith(ym))
    .map((d) => daysByDate[d])
    .filter((d) => d && d.isException && d.note)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (!notes.length) return "";
  const groups = [];
  for (const d of notes) {
    const prev = groups[groups.length - 1];
    if (prev && prev.note === d.note && addDaysYmdPub_(prev.to, 1) === d.date) {
      prev.to = d.date;
    } else {
      groups.push({ from: d.date, to: d.date, note: d.note });
    }
  }
  return groups.map((g) => {
    const label = g.from === g.to
      ? formatNoteDate_(g.from)
      : formatNoteDate_(g.from) + "–" + formatNoteDate_(g.to);
    return `<p class="note-line"><strong>${escapeHtml_(label)}</strong> — ${escapeHtml_(g.note)}</p>`;
  }).join("");
}

function render_() {
  const app = document.getElementById("app");
  if (!app) return;
  if (state.loading && !Object.keys(state.daysByDate).length && !state.week) {
    app.innerHTML = `<p class="boot">Hämtar öppettider…</p>`;
    return;
  }
  const notes = exceptionNotesHtml_(state.daysByDate, state.yearMonth);
  app.innerHTML = `
    <header>
      <h1 class="brand">Öppettider</h1>
      <p class="lede">Västerviks klätterhall — se dagens tider och kommande undantag.</p>
    </header>
    <div class="toolbar">
      <button type="button" class="nav-btn" onclick="shiftMonth(-1)" aria-label="Föregående månad">←</button>
      <p class="month-label">${escapeHtml_(monthTitle_(state.yearMonth))}</p>
      <button type="button" class="nav-btn" onclick="shiftMonth(1)" aria-label="Nästa månad">→</button>
      <span class="today-pill">Idag ${escapeHtml_(state.today || todayLocalYmd_())}</span>
    </div>
    <div class="legend">
      <span><i class="swatch open" aria-hidden="true"></i> Öppet</span>
      <span><i class="swatch closed" aria-hidden="true"></i> Stängt</span>
      <span><i class="swatch exception" aria-hidden="true"></i> Undantag</span>
    </div>
    <div class="cal" role="grid" aria-label="Öppettidskalender">
      ${DOW.map((d) => `<div class="dow">${d}</div>`).join("")}
      ${buildMonthGrid_(state.yearMonth, state.daysByDate, state.today)}
    </div>
    ${notes}
    <p class="status ${state.error ? "error" : ""}" id="status">
      ${state.error ? escapeHtml_(state.error) : (state.loading ? "Uppdaterar…" : "Uppdateras automatiskt")}
    </p>
  `;
}

function applyPayload_(res) {
  const map = {};
  (res.days || []).forEach((d) => {
    if (d && d.date) map[d.date] = d;
  });
  state.today = String(res.today || todayLocalYmd_());
  state.week = res.week || null;
  state.daysByDate = map;
  state.error = "";
  state.loading = false;
  if (!state.yearMonth) state.yearMonth = state.today.slice(0, 7);
}

function load_() {
  state.loading = true;
  render_();
  return apiCall_("getOpeningHours", [{ yearMonth: state.yearMonth }])
    .then((res) => {
      if (!res || res.ok === false) {
        state.error = (res && res.error) || "Kunde inte hämta öppettider";
        state.loading = false;
        render_();
        return;
      }
      applyPayload_(res);
      render_();
    })
    .catch(() => {
      state.error = "Nätverksfel — försök igen om en stund";
      state.loading = false;
      render_();
    });
}

function shiftMonth(delta) {
  state.yearMonth = shiftMonth_(state.yearMonth || todayLocalYmd_().slice(0, 7), delta);
  load_();
}
window.shiftMonth = shiftMonth;

if (!state.yearMonth) state.yearMonth = todayLocalYmd_().slice(0, 7);
load_();
refreshTimer = setInterval(load_, REFRESH_MS);
  </script>
</body>
</html>
