<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f2">
  <meta name="description" content="Gruppbokningar i Västerviks klätterhall — publik kalender.">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors *">
  <title>Gruppbokningar — Västerviks klätterhall</title>
  <link rel="icon" href="../favicon.ico" sizes="32x32">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f2f2;
      --text: #202124;
      --muted: #5f6368;
      --line: rgba(32, 33, 36, 0.14);
      --accent: #c47a1a;
      --surface: #ffffff;
      --surface-2: #e8e8e8;
      --booked: #d8f0e8;
      --booked-text: #1b5c48;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font: "Roboto", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: var(--font);
      background: var(--bg);
    }
    body {
      padding: calc(16px + var(--safe-top)) 14px calc(18px + var(--safe-bottom));
    }
    html.is-embed body { padding: 10px 10px 12px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    .brand {
      margin: 0;
      font-weight: 700;
      font-size: clamp(1.45rem, 5vw, 2rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .lede {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      max-width: 36em;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 16px 0 12px;
    }
    .nav-btn {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: 500;
      font-size: 0.85rem;
      padding: 8px 12px;
      cursor: pointer;
    }
    .nav-btn:hover { background: var(--surface-2); }
    .month-label {
      margin: 0 auto;
      font-weight: 700;
      font-size: 1.05rem;
      text-transform: capitalize;
    }
    .today-pill {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      border: 1px solid var(--line);
      display: inline-block;
      margin-right: 6px;
      vertical-align: -2px;
    }
    .swatch.booked { background: var(--booked); }
    .cal {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }
    .dow {
      text-align: center;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 0 6px;
    }
    .day {
      min-height: 84px;
      padding: 8px 6px 6px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .day.booked {
      background: var(--booked);
      border-color: rgba(27, 92, 72, 0.22);
      color: var(--booked-text);
    }
    .day.outside { opacity: 0.35; background: transparent; border-color: transparent; }
    .day.is-today { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
    .day-num { font-weight: 700; font-size: 0.82rem; }
    .day-item {
      font-size: 0.62rem;
      font-weight: 600;
      line-height: 1.2;
    }
    .day-item .t { display: block; }
    .day-item .g {
      display: block;
      font-weight: 500;
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }
    .card {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .card h3 { margin: 0 0 4px; font-size: 1rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.86rem; line-height: 1.35; }
    .status { margin: 12px 0 0; color: var(--muted); font-size: 0.78rem; font-weight: 500; }
    .status.error { color: #7a2e2e; }
    .boot { color: var(--muted); margin: 24px 0; }
    @media (max-width: 520px) {
      .day { min-height: 72px; }
      .day-item { font-size: 0.55rem; }
      .month-label { width: 100%; text-align: center; order: -1; }
      .today-pill { width: 100%; margin: 0; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <p class="boot">Hämtar gruppbokningar…</p>
  </div>
  <script>
const API_URL = "https://wallflow.muddy-rice-38d4.workers.dev/";
const REFRESH_MS = 5 * 60 * 1000;
const DOW = ["Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön"];
const MONTHS_SV = [
  "januari", "februari", "mars", "april", "maj", "juni",
  "juli", "augusti", "september", "oktober", "november", "december"
];

let state = { yearMonth: "", today: "", daysByDate: {}, bookings: [], error: "", loading: true };

(function () {
  const q = new URLSearchParams(location.search);
  if (q.get("embed") === "1" || window.self !== window.top) {
    document.documentElement.classList.add("is-embed");
  }
  const m = String(q.get("month") || "").trim();
  if (/^\d{4}-\d{2}$/.test(m)) state.yearMonth = m;
})();

function escapeHtml_(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function apiCall_(action, args) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain; charset=UTF-8" },
    body: JSON.stringify({ action, token: "", args: args || [] })
  }).then((r) => r.json());
}

function todayLocalYmd_() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function shiftMonth_(ym, delta) {
  const [y, m] = String(ym).split("-").map(Number);
  const dt = new Date(y, m - 1 + delta, 1);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0");
}

function monthTitle_(ym) {
  const [y, m] = String(ym).split("-").map(Number);
  return (MONTHS_SV[m - 1] || "") + " " + y;
}

function formatPeriod_(from, to) {
  if (!to || from === to) return from;
  return from + " – " + to;
}

function buildMonthGrid_(ym, daysByDate, today) {
  const [y, m] = String(ym).split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const lastDate = new Date(y, m, 0).getDate();
  let startPad = first.getDay() - 1;
  if (startPad < 0) startPad = 6;
  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push(null);
  for (let d = 1; d <= lastDate; d++) {
    const date = ym + "-" + String(d).padStart(2, "0");
    cells.push({ date, num: d, day: daysByDate[date] || null });
  }
  while (cells.length % 7 !== 0) cells.push(null);
  return cells.map((c) => {
    if (!c) return `<div class="day outside" aria-hidden="true"></div>`;
    const bookings = (c.day && c.day.bookings) || [];
    const booked = bookings.length > 0;
    const isToday = c.date === today;
    const items = bookings.slice(0, 3).map((b) =>
      `<div class="day-item"><span class="t">${escapeHtml_(b.hoursLabel || "")}</span><span class="g">${escapeHtml_(b.groupName || "")}</span></div>`
    ).join("");
    const more = bookings.length > 3 ? `<div class="day-item">+${bookings.length - 3}</div>` : "";
    return `<div class="day ${booked ? "booked" : ""}${isToday ? " is-today" : ""}">
      <div class="day-num">${c.num}</div>
      ${items}${more}
    </div>`;
  }).join("");
}

function listHtml_(bookings, ym) {
  const list = (bookings || [])
    .filter((b) => b && ((b.from || "").startsWith(ym) || (b.to || "").startsWith(ym) || (b.from <= ym + "-31" && b.to >= ym + "-01")))
    .sort((a, b) => String(a.from).localeCompare(String(b.from)) || String(a.startTime).localeCompare(String(b.startTime)));
  if (!list.length) return "";
  return `<section class="list" aria-label="Bokningar i månaden">
    ${list.map((b) => `<article class="card">
      <h3>${escapeHtml_(b.groupName || "Grupp")}</h3>
      <p>${escapeHtml_(formatPeriod_(b.from, b.to))} · ${escapeHtml_(b.hoursLabel || "")}</p>
      ${b.note ? `<p>${escapeHtml_(b.note)}</p>` : ""}
    </article>`).join("")}
  </section>`;
}

function render_() {
  const app = document.getElementById("app");
  if (!app) return;
  if (state.loading && !Object.keys(state.daysByDate).length) {
    app.innerHTML = `<p class="boot">Hämtar gruppbokningar…</p>`;
    return;
  }
  app.innerHTML = `
    <header>
      <h1 class="brand">Gruppbokningar</h1>
      <p class="lede">Västerviks klätterhall — bokade grupptider i hallen.</p>
    </header>
    <div class="toolbar">
      <button type="button" class="nav-btn" onclick="shiftMonth(-1)" aria-label="Föregående månad">←</button>
      <p class="month-label">${escapeHtml_(monthTitle_(state.yearMonth))}</p>
      <button type="button" class="nav-btn" onclick="shiftMonth(1)" aria-label="Nästa månad">→</button>
      <span class="today-pill">Idag ${escapeHtml_(state.today || todayLocalYmd_())}</span>
    </div>
    <div class="legend"><span><i class="swatch booked" aria-hidden="true"></i> Bokad grupp</span></div>
    <div class="cal" role="grid" aria-label="Gruppbokningskalender">
      ${DOW.map((d) => `<div class="dow">${d}</div>`).join("")}
      ${buildMonthGrid_(state.yearMonth, state.daysByDate, state.today)}
    </div>
    ${listHtml_(state.bookings, state.yearMonth)}
    <p class="status ${state.error ? "error" : ""}">
      ${state.error ? escapeHtml_(state.error) : (state.loading ? "Uppdaterar…" : "Uppdateras automatiskt")}
    </p>
  `;
}

function load_() {
  state.loading = true;
  render_();
  return apiCall_("getGroupBookings", [{ yearMonth: state.yearMonth }])
    .then((res) => {
      if (!res || res.ok === false) {
        state.error = (res && res.error) || "Kunde inte hämta gruppbokningar";
        state.loading = false;
        render_();
        return;
      }
      const map = {};
      (res.days || []).forEach((d) => { if (d && d.date) map[d.date] = d; });
      state.today = String(res.today || todayLocalYmd_());
      state.daysByDate = map;
      state.bookings = res.bookings || [];
      state.error = "";
      state.loading = false;
      if (!state.yearMonth) state.yearMonth = state.today.slice(0, 7);
      render_();
    })
    .catch(() => {
      state.error = "Nätverksfel — försök igen om en stund";
      state.loading = false;
      render_();
    });
}

function shiftMonth(delta) {
  state.yearMonth = shiftMonth_(state.yearMonth || todayLocalYmd_().slice(0, 7), delta);
  load_();
}
window.shiftMonth = shiftMonth;

if (!state.yearMonth) state.yearMonth = todayLocalYmd_().slice(0, 7);
load_();
setInterval(load_, REFRESH_MS);
  </script>
</body>
</html>
